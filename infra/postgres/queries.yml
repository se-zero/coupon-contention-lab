# postgres_exporter 커스텀 쿼리 (PROJECT_BRIEF 7장 "DB 지표")

# 상태별 커넥션 수 — 앱 풀(30)과 대조해 커넥션 누수를 판별한다
pg_stat_activity:
  query: |
    SELECT datname,
           state,
           count(*) AS count,
           COALESCE(EXTRACT(EPOCH FROM max(now() - state_change)), 0) AS max_state_seconds
    FROM pg_stat_activity
    WHERE datname IS NOT NULL AND state IS NOT NULL
    GROUP BY datname, state
  metrics:
    - datname:
        usage: "LABEL"
    - state:
        usage: "LABEL"
    - count:
        usage: "GAUGE"
        description: "상태별 커넥션 수"
    - max_state_seconds:
        usage: "GAUGE"
        description: "해당 상태 최대 지속 시간(초)"

# 획득하지 못한 잠금 — W1 비관적 락의 대기 누적을 관측한다
pg_locks_waiting:
  query: |
    SELECT COALESCE(d.datname, 'unknown') AS datname,
           l.mode,
           count(*) AS count
    FROM pg_locks l
    LEFT JOIN pg_database d ON d.oid = l.database
    WHERE NOT l.granted
    GROUP BY 1, 2
  metrics:
    - datname:
        usage: "LABEL"
    - mode:
        usage: "LABEL"
    - count:
        usage: "GAUGE"
        description: "대기 중인 잠금 수"
