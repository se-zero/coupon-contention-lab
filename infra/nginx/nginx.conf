# 2단계 전용 라운드로빈 로드밸런서 (PROJECT_BRIEF 7장)
user nginx;
worker_processes auto;

events {
    # 순간 집중 부하 대비 여유
    worker_connections 8192;
}

http {
    # 부하 구간 로그 I/O 를 측정 노이즈에서 제외
    access_log off;

    upstream coupon_app {
        # app 은 DNS 가 A 레코드 2개로 풀린다 (--scale app=2) + app-worker 1대 → 총 3대
        server app:8080;
        server app-worker:8080;
        keepalive 256;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://coupon_app;
            # 커넥션 재사용 — HTTP/1.1 + Connection 헤더 제거 필요 (upstream keepalive 조건)
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # 기본값($proxy_host)은 업스트림 이름이 그대로 들어가 Tomcat 이 400 으로 거부한다
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
            # proxy_next_upstream 기본값(error timeout) 유지 — POST 는 기본적으로 재시도 대상이 아니다
        }
    }
}
