global:
  # 기본 15초로는 spike 와 TTL 만료 순간을 놓친다
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # 애플리케이션 — dns_sd 로 붙여야 --scale app=3 에서 3대가 모두 수집된다
  # 포트 8081 은 관리 전용 커넥터다. 8080 을 긁으면 부하 구간에서 타임아웃된다
  - job_name: coupon-app
    metrics_path: /actuator/prometheus
    scrape_interval: 1s
    scrape_timeout: 1s
    dns_sd_configs:
      - names: [ app ]
        type: A
        port: 8081

  - job_name: postgres
    static_configs:
      - targets: [ 'postgres-exporter:9187' ]

  - job_name: redis
    static_configs:
      - targets: [ 'redis-exporter:9121' ]

  - job_name: prometheus
    static_configs:
      - targets: [ 'localhost:9090' ]
